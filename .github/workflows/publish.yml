name: Publish to npm

# Runs when a release is published by a user. Releases created with the
# repo's GITHUB_TOKEN (the release.yml workflow) don't emit workflow-
# triggering events, so release.yml chains into this via workflow_dispatch.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.56.1)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${PACKAGE_VERSION}"

      - run: bun run build

      # The server ships as a bundle (scripts/build-server.ts), which can build
      # fine and still fail at runtime. Install the packed package into an
      # empty folder and start it before anything is uploaded or published.
      - run: bun run smoke:package

      - run: bun run prepare:export-viewer-release-assets

      - name: Upload export viewer release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" dist/export-viewer-release-assets/* --clobber

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm publish --provenance --access public
