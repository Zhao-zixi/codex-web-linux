name: Remote workspace

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: |
          export no_proxy="$NO_PROXY"
          printf 'Bun version: '
          bun --version
          time timeout --signal=TERM --kill-after=10s 5m bun test

  docker-ssh-mutagen-e2e:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Install pinned Mutagen CLI from the official release
        env:
          MUTAGEN_VERSION: 0.18.1
          MUTAGEN_SHA256: 7735286c778cc438418209f24d03a64f3a0151c8065ef0fe079cfaf093af6f8f
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mutagen_linux_amd64_v${MUTAGEN_VERSION}.tar.gz"
          bin_dir="$RUNNER_TEMP/bin"
          mkdir -p "$bin_dir"
          curl --fail --location --retry 3 \
            "https://github.com/mutagen-io/mutagen/releases/download/v${MUTAGEN_VERSION}/mutagen_linux_amd64_v${MUTAGEN_VERSION}.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$MUTAGEN_SHA256" "$archive" | sha256sum --check
          tar -tzf "$archive" > "$RUNNER_TEMP/mutagen-archive-files.txt"
          printf 'mutagen\nmutagen-agents.tar.gz\n' | diff -u - "$RUNNER_TEMP/mutagen-archive-files.txt"
          tar -xzf "$archive" --directory "$bin_dir" --no-same-owner --no-same-permissions mutagen mutagen-agents.tar.gz
          chmod 755 "$bin_dir/mutagen"
          chmod 644 "$bin_dir/mutagen-agents.tar.gz"
          test -r "$bin_dir/mutagen-agents.tar.gz"
          tar -tzf "$bin_dir/mutagen-agents.tar.gz" > "$RUNNER_TEMP/mutagen-agent-files.txt"
          grep -Fxq linux_amd64 "$RUNNER_TEMP/mutagen-agent-files.txt"
          test "$("$bin_dir/mutagen" version)" = "$MUTAGEN_VERSION"
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Require Docker daemon
        run: docker info
      - run: |
          export no_proxy="$NO_PROXY"
          bun run test:remote-workspace:e2e
      - name: Build pinned Playwright browser E2E image
        run: docker build -t kanna-remote-workspace-browser-e2e:1.64.0 -f deploy/remote-workspace/Dockerfile.browser-e2e .
      - name: Run strict-CA shared hostname browser E2E
        run: |
          export no_proxy="$NO_PROXY"
          bun run test:remote-workspace:shared-browser
      - name: Run shared hostname SSH and Mutagen E2E
        run: |
          export no_proxy="$NO_PROXY"
          bun run test:remote-workspace:shared-e2e
