name: Remote workspace

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Run unit tests with stall diagnostics
        run: |
          set -uo pipefail
          export no_proxy="$NO_PROXY"
          export KANNA_CI_TEST_DIAG=1
          bun test &
          test_pid=$!

          (
            sleeper_pid=""
            stop_sleeper() {
              if [ -n "$sleeper_pid" ]; then
                kill "$sleeper_pid" 2>/dev/null || true
              fi
            }
            trap stop_sleeper EXIT TERM
            sleep 300 &
            sleeper_pid=$!
            wait "$sleeper_pid" || exit 0
            sleeper_pid=""
            state="$(awk '{print $3}' "/proc/$test_pid/stat" 2>/dev/null || true)"
            if kill -0 "$test_pid" 2>/dev/null && [ "$state" != Z ]; then
              echo "[ci-diag watchdog] bun test exceeded 300 seconds; process metadata follows" >&2
              ps -T -p "$test_pid" -o pid,tid,stat,comm,wchan >&2 || true
              for task in /proc/"$test_pid"/task/*; do
                [ -d "$task" ] || continue
                tid="${task##*/}"
                state="$(awk '$1 == "State:" { print $2 }' "$task/status" 2>/dev/null || true)"
                comm="$(cat "$task/comm" 2>/dev/null || true)"
                wchan="$(cat "$task/wchan" 2>/dev/null || true)"
                printf '[ci-diag watchdog] tid=%s state=%s comm=%s wchan=%s\n' "$tid" "$state" "$comm" "$wchan" >&2
              done
              fd_count="$(find "/proc/$test_pid/fd" -mindepth 1 -maxdepth 1 -type l 2>/dev/null | wc -l | tr -d ' ')"
              printf '[ci-diag watchdog] fd_count=%s\n' "$fd_count" >&2
              kill -TERM "$test_pid" 2>/dev/null || true
              sleep 5
              if kill -0 "$test_pid" 2>/dev/null; then
                kill -KILL "$test_pid" 2>/dev/null || true
              fi
            fi
          ) &
          watchdog_pid=$!

          if wait "$test_pid"; then
            test_status=0
          else
            test_status=$?
          fi
          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" 2>/dev/null || true
          exit "$test_status"

  docker-ssh-mutagen-e2e:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Install pinned Mutagen CLI from the official release
        env:
          MUTAGEN_VERSION: 0.18.1
          MUTAGEN_SHA256: 7735286c778cc438418209f24d03a64f3a0151c8065ef0fe079cfaf093af6f8f
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mutagen_linux_amd64_v${MUTAGEN_VERSION}.tar.gz"
          bin_dir="$RUNNER_TEMP/bin"
          mkdir -p "$bin_dir"
          curl --fail --location --retry 3 \
            "https://github.com/mutagen-io/mutagen/releases/download/v${MUTAGEN_VERSION}/mutagen_linux_amd64_v${MUTAGEN_VERSION}.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$MUTAGEN_SHA256" "$archive" | sha256sum --check
          tar -tzf "$archive" > "$RUNNER_TEMP/mutagen-archive-files.txt"
          printf 'mutagen\nmutagen-agents.tar.gz\n' | diff -u - "$RUNNER_TEMP/mutagen-archive-files.txt"
          tar -xzf "$archive" --directory "$bin_dir" --no-same-owner --no-same-permissions mutagen mutagen-agents.tar.gz
          chmod 755 "$bin_dir/mutagen"
          chmod 644 "$bin_dir/mutagen-agents.tar.gz"
          test -r "$bin_dir/mutagen-agents.tar.gz"
          tar -tzf "$bin_dir/mutagen-agents.tar.gz" > "$RUNNER_TEMP/mutagen-agent-files.txt"
          grep -Fxq linux_amd64 "$RUNNER_TEMP/mutagen-agent-files.txt"
          test "$("$bin_dir/mutagen" version)" = "$MUTAGEN_VERSION"
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: Require Docker daemon
        run: docker info
      - run: |
          export no_proxy="$NO_PROXY"
          bun run test:remote-workspace:e2e
