# Kanna for Mac. This file is the source of truth; Kanna.xcodeproj is
# generated (`xcodegen generate`) and ignored, so branches never conflict in
# project.pbxproj.
#
# The app is a window around the Kanna web client, served by the globally
# installed `kanna` (bun install -g kanna-code), which it starts, or installs
# when it's missing. It carries no server of its own, so it releases only when
# this Swift code changes; Kanna itself keeps updating from npm.
name: Kanna
options:
  bundleIdPrefix: sh.kanna
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4

schemes:
  Kanna:
    build:
      targets:
        Kanna: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Kanna:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Kanna
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Kanna
        PRODUCT_BUNDLE_IDENTIFIER: sh.kanna.mac
        INFOPLIST_FILE: Kanna/Info.plist
        CODE_SIGN_ENTITLEMENTS: Kanna/Kanna.entitlements
        # build.sh signs for release (Developer ID, with Sparkle's helpers).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        # The app's own version, independent of kanna-code's. build.sh sets the
        # build number (CFBundleVersion, which Sparkle compares) from the
        # commit count, so it only goes up.
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # Sparkle: an empty key leaves the updater off (Debug builds).
        KANNA_APPCAST_URL: "https://kanna.sh/downloads/mac/appcast.xml"
        SPARKLE_PUBLIC_KEY: ""
        # Debug builds start in this checkout's `bun run dev`
        # (macos/Kanna/ServerMode.swift); every build can switch.
        KANNA_DEV_CHECKOUT: ""
      configs:
        Debug:
          KANNA_DEV_CHECKOUT: "$(PROJECT_DIR)/.."
          # Its own app, so its settings, login item and Full Disk Access never
          # mix with an installed Kanna's, and `kanna-app://` links from a
          # terminal reach the installed one.
          PRODUCT_BUNDLE_IDENTIFIER: sh.kanna.mac.dev
          PRODUCT_NAME: Kanna Dev
        Release:
          # Public half of the update-signing key (Sparkle generate_keys
          # --account kanna); the private half is in the release machine's
          # keychain.
          SPARKLE_PUBLIC_KEY: "NTS707jtsned9EGqMowFmrAAWLokq433gLD8n5Rz6CE="
