<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Kanna</title>
<!--
  Covers the page until the server answers: while it starts, when `kanna`
  still has to be installed, and when it can't start. It is the first thing
  a new user sees, so it looks like the web setup wizard that follows
  (src/client/components/auth/SetupWizard.tsx): the flower in the logo pink,
  the thin progress bar, a centered heading and pill buttons, in one
  fixed-width column so installer output never moves the buttons.
-->
<style>
  :root {
    color-scheme: light dark;
    --logo: #ff637e;
    --label: light-dark(#0f172a, #fafafa);
    --secondary: light-dark(rgb(0 0 0 / 0.55), rgb(255 255 255 / 0.55));
    --primary: light-dark(#0f172a, #fafafa);
    --primary-text: light-dark(#fafafa, #0f172a);
    --track: light-dark(rgb(0 0 0 / 0.12), rgb(255 255 255 / 0.12));
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--background, Canvas);
    color: var(--label);
    font: 13px -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    /* The whole cover drags the window: it hides the page's title bar. */
    -webkit-app-region: drag;
    user-select: none;
    cursor: default;
  }
  .column {
    width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: -48px;
  }
  .logo { width: 28px; height: 28px; margin-bottom: 20px; }
  .bar {
    width: 176px; height: 4px; border-radius: 2px;
    background: var(--track);
    overflow: hidden;
    position: relative;
    margin-bottom: 32px;
  }
  .bar[hidden] { display: block; visibility: hidden; }
  .fill {
    position: absolute; top: 0; left: 0; height: 100%;
    border-radius: 2px;
    background: var(--logo);
    width: 30%;
  }
  /* Without a percentage a short segment runs across at a constant speed:
     steady motion, not an arrival. */
  .bar.sweeping .fill { animation: sweep 1.1s linear infinite; }
  .bar.determinate .fill { transition: width 0.2s cubic-bezier(0.23, 1, 0.32, 1); }
  @keyframes sweep {
    from { transform: translateX(-100%); }
    /* The segment is 30% of the track: 1 / 0.3 of its own width crosses it. */
    to { transform: translateX(333.34%); }
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; text-align: center; }
  .detail {
    width: 100%;
    color: var(--secondary);
    text-align: center;
    line-height: 1.4;
    margin-bottom: 28px;
    user-select: text;
    -webkit-app-region: no-drag;
    cursor: text;
  }
  .detail.mono {
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: nowrap;
    overflow: hidden;
  }
  .buttons { display: flex; gap: 8px; }
  button {
    -webkit-app-region: no-drag;
    height: 36px;
    padding: 0 18px;
    border-radius: 18px;
    font: 500 13px -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--label);
    background: light-dark(rgb(0 0 0 / 0.04), rgb(255 255 255 / 0.04));
    border: 1px solid light-dark(rgb(0 0 0 / 0.14), rgb(255 255 255 / 0.14));
    cursor: pointer;
  }
  button:active { background: light-dark(rgb(0 0 0 / 0.1), rgb(255 255 255 / 0.1)); }
  button.primary { background: var(--primary); color: var(--primary-text); border-color: transparent; }
  button.primary:active { opacity: 0.8; }
  button:focus { outline: none; }
</style>
</head>
<body>
  <div class="column">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#FF637E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 16.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 1 1 4.5 4.5 4.5 4.5 0 1 1-4.5 4.5"/><path d="M12 7.5V9"/><path d="M7.5 12H9"/><path d="M16.5 12H15"/><path d="M12 16.5V15"/><path d="m8 8 1.88 1.88"/><path d="M14.12 9.88 16 8"/><path d="m8 16 1.88-1.88"/><path d="M14.12 14.12 16 16"/></svg>
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <h1 id="title"></h1>
    <div class="detail" id="detail"></div>
    <div class="buttons" id="buttons"></div>
  </div>
<script>
  const bar = document.getElementById("bar")
  const fill = document.getElementById("fill")
  const title = document.getElementById("title")
  const detail = document.getElementById("detail")
  const buttons = document.getElementById("buttons")
  let actions = []
  // The installer's last line of words, shown while a download's bare
  // progress line ("#### 54.9%") only moves the bar.
  let lastWords = null

  // curl's bar before it has a percentage ("#=#=-#   #"), or a blank line.
  const isProgressNoise = (line) => /^[#=\-O>\s]*$/.test(line)
  const percent = (line) => {
    const match = line.match(/^[#\s=>-]*([0-9]+(?:\.[0-9]+)?)%\s*$/)
    return match ? Math.min(Math.max(Number(match[1]) / 100, 0), 1) : null
  }

  // One line of installer output, cut in the middle, so the column never
  // changes height while it streams.
  const fitMiddle = (text) => {
    detail.textContent = text
    if (detail.scrollWidth <= detail.clientWidth) return
    let keep = text.length
    while (keep > 8) {
      keep -= 2
      const half = Math.floor(keep / 2)
      detail.textContent = text.slice(0, half) + "…" + text.slice(text.length - half)
      if (detail.scrollWidth <= detail.clientWidth) return
    }
  }

  window.kannaPanel.onState((state) => {
    if (state.background) document.body.style.setProperty("--background", state.background)
    else document.body.style.removeProperty("--background")
    if (state.hidden) return

    const changedScreen = title.textContent !== state.title
    title.textContent = state.title

    let text = state.detail ?? null
    let progress = null
    if (state.monospaced && text !== null) {
      const value = percent(text)
      if (value !== null) {
        progress = value
        text = lastWords
      } else if (!isProgressNoise(text)) {
        lastWords = text
      } else {
        text = lastWords
      }
    } else {
      lastWords = null
    }
    if (changedScreen && !state.monospaced) lastWords = null

    detail.hidden = text === null
    detail.classList.toggle("mono", !!state.monospaced)
    if (state.monospaced) fitMiddle(text ?? "")
    else detail.textContent = text ?? ""

    bar.hidden = !state.busy
    if (state.busy && progress !== null) {
      bar.classList.remove("sweeping")
      bar.classList.add("determinate")
      fill.style.width = `${progress * 100}%`
    } else {
      // A line of words after a download means the next phase: back to the sweep.
      bar.classList.remove("determinate")
      bar.classList.toggle("sweeping", !!state.busy)
      fill.style.width = "30%"
    }

    // Rebuild the buttons only when they change, so a streaming line never
    // re-lays them out.
    const titles = state.actions.map((action) => action.title).join("\n")
    actions = state.actions
    if (titles !== [...buttons.children].map((button) => button.textContent).join("\n")) {
      buttons.replaceChildren(...state.actions.map((action, index) => {
        const button = document.createElement("button")
        button.textContent = action.title
        if (action.isDefault) button.className = "primary"
        button.addEventListener("click", () => window.kannaPanel.action(actions[index].id))
        return button
      }))
    }
    buttons.hidden = state.actions.length === 0
  })

  addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return
    const action = actions.find((candidate) => candidate.isDefault)
    if (action) window.kannaPanel.action(action.id)
  })
</script>
</body>
</html>
